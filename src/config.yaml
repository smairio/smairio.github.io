site:
  name: LamdaSoft
  site: 'https://smairio.github.io'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: '' # TODO: add once the Search Console property is claimed

# Default SEO metadata
metadata:
  title:
    default: 'LamdaSoft — Digitalisez votre entreprise'
    template: '%s — LamdaSoft'
  description: 'LamdaSoft accompagne les entreprises tunisiennes dans leur passage au numérique : sites web, applications mobiles, outils de gestion sur mesure, automatisation et hébergement cloud.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: LamdaSoft
    images:
      # Generated from default.svg — see `npm run og:image`
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    cardType: summary_large_image

i18n:
  language: fr
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

# The devanture world is daylight commerce — there is no night register (DESIGN.md).
ui:
  theme: 'light:only'
