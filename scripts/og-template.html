<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Archivo Black';
        src: url('../node_modules/@fontsource/archivo-black/files/archivo-black-latin-400-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Archivo Variable';
        src: url('../node_modules/@fontsource-variable/archivo/files/archivo-latin-wght-normal.woff2')
          format('woff2-variations');
        font-weight: 100 900;
      }
      * {
        margin: 0;
        box-sizing: border-box;
      }
      body {
        width: 1200px;
        height: 628px;
        background: #0e4b38;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Archivo Variable', sans-serif;
      }
      .board {
        text-align: center;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        box-shadow:
          inset 0 0 0 10px #0e4b38,
          inset 0 0 0 13px rgba(244, 238, 225, 0.75),
          inset 0 0 0 22px #0e4b38,
          inset 0 0 0 24px rgba(244, 238, 225, 0.45);
      }
      .plaque {
        display: inline-block;
        background: #f4eee1;
        color: #231f17;
        border: 2px solid #231f17;
        box-shadow: 4px 4px 0 rgba(35, 31, 23, 0.85);
        font-family: 'Archivo Black', sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 21px;
        padding: 8px 18px;
      }
      h1 {
        margin-top: 36px;
        font-family: 'Archivo Black', sans-serif;
        text-transform: uppercase;
        font-size: 108px;
        line-height: 0.95;
        color: #f4eee1;
        text-shadow: 5px 5px 0 #231f17;
      }
      h1 .ochre {
        color: #e9a820;
      }
      .trades {
        margin-top: 38px;
        color: #d8e4dc;
        font-family: 'Archivo Black', sans-serif;
        text-transform: uppercase;
        font-size: 25px;
        letter-spacing: 0.14em;
        border-top: 2px solid rgba(216, 228, 220, 0.7);
        border-bottom: 2px solid rgba(216, 228, 220, 0.7);
        padding: 14px 30px;
      }
      .trades .d {
        color: #e9a820;
        padding: 0 10px;
      }
    </style>
  </head>
  <body>
    <div class="board">
      <p class="plaque">LamdaSoft · Agence digitale · Tunisie</p>
      <h1>Digitalisez<br /><span class="ochre">votre commerce</span></h1>
      <p class="trades">
        Sites web<span class="d">◆</span>Applications<span class="d">◆</span>Gestion<span class="d">◆</span>IA<span
          class="d"
          >◆</span
        >Cloud
      </p>
    </div>
  </body>
</html>
